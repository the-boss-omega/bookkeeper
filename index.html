<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Routines</title>
  <meta name="description" content="A calm, minimal tracker for your daily routines.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Routines">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="date"></p>
        <h1 id="title"></h1>
      </div>
      <div class="ring" id="ring" role="img">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="ring-track" cx="32" cy="32" r="28"></circle>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="28"></circle>
        </svg>
        <span id="ring-label"></span>
      </div>
    </header>

    <div class="week-head">
      <span id="week-label">This week</span>
      <div class="week-nav">
        <button type="button" class="pill" id="today-btn" hidden>Today</button>
        <button type="button" class="nav-btn" id="prev-week" aria-label="Previous week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button type="button" class="nav-btn" id="next-week" aria-label="Next week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <nav class="week" id="week" aria-label="Choose a day"></nav>

    <p class="status" id="status"></p>

    <ul class="list" id="list"></ul>

    <section class="others" id="others-wrap" hidden>
      <p class="section-label">Not on this day</p>
      <ul class="list" id="others"></ul>
    </section>

    <section class="empty" id="empty" hidden>
      <p class="empty-title">Start with one <em>small</em> thing.</p>
      <p class="empty-sub">Tap a suggestion or write your own below.</p>
      <div class="chips" id="chips"></div>
    </section>

    <footer class="foot">
      <button type="button" id="export">Export</button>
      <span aria-hidden="true">·</span>
      <label>Import<input type="file" id="import" accept="application/json" hidden></label>
    </footer>
  </main>

  <form class="composer" id="add-form" autocomplete="off">
    <div class="composer-days">
      <p class="section-label">Repeats on</p>
      <div class="daypick" id="add-days" role="group" aria-label="Repeats on"></div>
    </div>
    <div class="composer-row">
      <input id="add-input" type="text" placeholder="New routine…" maxlength="60" aria-label="New routine" required>
      <button type="submit" class="add-btn" aria-label="Add routine">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </form>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-name">
    <form id="sheet-form" autocomplete="off">
      <input class="sheet-name" id="sheet-name" type="text" maxlength="60" aria-label="Routine name" required>

      <p class="section-label">Repeats on</p>
      <div class="daypick" id="sheet-days" role="group" aria-label="Repeats on"></div>

      <section id="status-section">
        <p class="section-label" id="status-label">Today</p>
        <div class="status-pick" id="status-pick" role="group" aria-labelledby="status-label"></div>
      </section>

      <section id="move-section">
        <p class="section-label" id="move-label">Move this session</p>
        <div class="daypick dated" id="move-days" role="group" aria-labelledby="move-label"></div>
        <p class="hint" id="move-hint"></p>
      </section>

      <div class="sheet-actions">
        <button type="button" class="text-btn danger" id="sheet-delete">Delete</button>
        <span></span>
        <button type="button" class="text-btn" id="sheet-cancel">Cancel</button>
        <button type="submit" class="solid-btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>

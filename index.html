<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Routines</title>
  <meta name="description" content="A calm, minimal tracker for your daily routines.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Routines">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="date"></p>
        <h1 id="title"></h1>
      </div>
      <div class="ring" id="ring" role="img">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="ring-track" cx="32" cy="32" r="28"></circle>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="28"></circle>
        </svg>
        <span id="ring-label"></span>
      </div>
    </header>

    <nav class="week" id="week" aria-label="Choose a day"></nav>

    <p class="status" id="status"></p>

    <ul class="list" id="list"></ul>

    <section class="empty" id="empty" hidden>
      <p class="empty-title">Start with one <em>small</em> thing.</p>
      <p class="empty-sub">Tap a suggestion or write your own below.</p>
      <div class="chips" id="chips"></div>
    </section>

    <footer class="foot">
      <button type="button" id="export">Export</button>
      <span aria-hidden="true">·</span>
      <label>Import<input type="file" id="import" accept="application/json" hidden></label>
    </footer>
  </main>

  <form class="composer" id="add-form" autocomplete="off">
    <input id="add-input" type="text" placeholder="New routine…" maxlength="60" aria-label="New routine" required>
    <button type="submit" aria-label="Add routine">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>

  <script src="app.js"></script>
</body>
</html>
